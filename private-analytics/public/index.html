<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stéphanie | Statistiques privées</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#43363b;background:#faf7f6}body{margin:0}main{max-width:1100px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:27px;margin:8px 0}small{color:#876d77}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin:25px 0}.card,section{background:white;border:1px solid #eadfe2;border-radius:16px;padding:20px;box-shadow:0 3px 15px #4c25310a}.value{font-size:29px;margin:10px 0;color:#9b647b}section{margin:16px 0;overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px;border-bottom:1px solid #f1e8eb}th{color:#806974}select,button{border:1px solid #decbd2;background:white;border-radius:9px;padding:9px;color:#604451}button{cursor:pointer}#status{font-size:13px;color:#765e68}
</style></head><body><main><header><div><small>STÉPHANIE HAIRSTYLIST · ACCÈS PRIVÉ</small><h1>Tableau de bord</h1><small>Statistiques Matomo, sans exposition publique</small></div><div><label for="period">Période </label><select id="period"><option value="day">Aujourd'hui</option><option value="week">Cette semaine</option><option value="month">Ce mois</option></select> <button id="refresh">Actualiser</button></div></header><p id="status" role="status">Chargement…</p><div class="cards" id="cards"></div><section><h2>Pages consultées</h2><div id="pages"></div></section><section><h2>Provenance des visites</h2><div id="referrers"></div></section><section><h2>Pays</h2><div id="countries"></div></section><section><h2>Appareils</h2><div id="devices"></div></section><section><h2>Navigateurs</h2><div id="browsers"></div></section><section><h2>Activité récente</h2><div id="realtime"></div></section><small>Les données dépendent de la configuration Matomo. Aucun renseignement nominatif n'est affiché.</small></main><script>
const $=id=>document.getElementById(id);
const fmt=n=>typeof n==='number'?new Intl.NumberFormat('fr-FR').format(n):n??'—';
function table(rows){if(!Array.isArray(rows)||!rows.length)return '<p>Aucune donnée disponible.</p>';const fields=['label','nb_visits','nb_hits','nb_pageviews','nb_uniq_pageviews','sum_time_spent','bounce_rate'];const keys=fields.filter(k=>rows.some(r=>r[k]!==undefined));const labels={label:'Nom',nb_visits:'Visites',nb_hits:'Actions',nb_pageviews:'Pages vues',nb_uniq_pageviews:'Vues uniques',sum_time_spent:'Temps total (s)',bounce_rate:'Rebond'};const esc=v=>String(fmt(v)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));return '<table><thead><tr>'+keys.map(k=>'<th>'+labels[k]+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,30).map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function load(){const p=$('period').value;const date=p==='day'?'today':new Date().toLocaleDateString('sv-SE');$('status').textContent='Actualisation…';const types=['overview','pages','referrers','countries','devices','browsers','realtime'];const out=await Promise.all(types.map(async t=>{try{const r=await fetch('/api/report?type='+t+'&period='+p+'&date='+date);if(!r.ok)throw Error();return await r.json()}catch{return null}}));const data=Object.fromEntries(types.map((t,i)=>[t,out[i]]));const metrics=[['Visites','nb_visits'],['Visiteurs uniques','nb_uniq_visitors'],['Actions','nb_actions'],['Pages vues','nb_pageviews'],['Durée moyenne (s)','avg_time_on_site'],['Taux de rebond','bounce_rate']];$('cards').innerHTML=metrics.map(([label,key])=>'<div class="card"><small>'+label+'</small><div class="value">'+fmt(data.overview?.[key])+'</div></div>').join('');for(const t of types.filter(t=>t!=='overview'))$(t).innerHTML=table(data[t]);$('status').textContent='Dernière actualisation : '+new Date().toLocaleTimeString('fr-FR')+(out.some(x=>x===null)?' · Certains rapports sont indisponibles':'')}
$('refresh').addEventListener('click',load);$('period').addEventListener('change',load);load();
</script></body></html>
